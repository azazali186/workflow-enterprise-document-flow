apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuflow-api
  namespace: docuflow
  labels:
    app.kubernetes.io/name: docuflow-api
    app.kubernetes.io/part-of: aeroxe-ecosystem
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docuflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docuflow-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: api
          image: ghcr.io/aeroxe/docuflow-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: docuflow-config
            - secretRef:
                name: docuflow-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: storage
              mountPath: /data/storage
      volumes:
        - name: tmp
          emptyDir: {}
        - name: storage
          emptyDir: {}
