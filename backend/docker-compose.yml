services:
  postgres:
    image: postgres:15-alpine
    container_name: docuflow-postgres
    environment:
      POSTGRES_DB: docu_flow
      POSTGRES_USER: aeroxe
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroxe -d docu_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docuflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: docuflow-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:latest
    container_name: docuflow-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: docuflow
      MINIO_ROOT_PASSWORD: docuflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: docuflow-frontend
    # nginx serves the SPA and proxies /api + /ws to the backend service.
    # Change this to the app's real hostname/URL in production.
    environment:
      BACKEND_HOST: app
      BACKEND_PORT: "8080"
    ports:
      - "8081:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuflow-app
    environment:
      # Local stack defaults to development. For production set ENV=production
      # AND override JWT_SECRET / ENCRYPTION_KEY / ADMIN_PASSWORD / CORS_ORIGINS:
      # config.Load fails fast on the dev defaults below when ENV=production.
      ENV: ${ENV:-development}
      PORT: "8080"
      DATABASE_URL: postgres://aeroxe:secret@postgres:5432/docu_flow?sslmode=disable
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-please-32bytes}
      # Dev-only default; override with a fresh 32-byte base64 key (openssl rand -base64 32).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aeroxe.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: docuflow
      S3_SECRET_KEY: docuflow-secret
      S3_BUCKET: docuflow
      S3_USE_SSL: "false"
      STORAGE_DIR: /data/storage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      # The API is POST-only (project convention); a plain GET 404s.
      test: ["CMD", "wget", "-q", "-O", "-", "--post-data={}", "--header=Content-Type: application/json", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  miniodata:
