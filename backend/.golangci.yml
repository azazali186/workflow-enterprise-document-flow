# golangci-lint v2 configuration.
# The project builds with -tags "stdjson gjson" (routes Hertz off
# bytedance/sonic); the linter must analyse the same code.
version: "2"

run:
  timeout: 5m
  tests: true

build:
  tags: [stdjson, gjson]

linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - gosec
    - misspell
    - nilerr
    - unconvert
    - whitespace
  exclusions:
    generated: lax
    paths:
      - docs/
    rules:
      # Test files legitimately define fake secrets and accept any issuer.
      - linters: [gosec]
        path: '(_test\.go)$'
        text: '(G101|G104)'
