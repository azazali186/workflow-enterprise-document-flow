name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: vet + test + build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the Trivy SARIF to code scanning
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Vet
        working-directory: backend
        run: go vet -tags "stdjson gjson" ./...

      - name: Unit tests
        working-directory: backend
        run: go test -tags "stdjson gjson" -race -cover ./...

      - name: Build
        working-directory: backend
        run: go build -tags "stdjson gjson" -o /tmp/docuflow-server ./cmd/server

      - name: Build image
        run: docker build -t docuflow-server:ci backend/

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: docuflow-server:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1" # gate: a critical/high known vulnerability fails the build

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  integration:
    name: integration (postgres + redis + nats-js)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: docu_flow_test
          POSTGRES_USER: aeroxe
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeroxe -d docu_flow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      nats:
        image: nats:2.10-alpine
        command: ["-js", "-m", "8222"]
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget -qO- http://localhost:8222/healthz || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Integration tests (real infra)
        working-directory: backend
        env:
          DATABASE_URL: postgres://aeroxe:secret@localhost:5432/docu_flow_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222
          JWT_SECRET: ci-integration-test-secret
        run: go test -tags "integration stdjson gjson" -race -v ./internal/integration/...

  frontend:
    name: frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e (playwright vs dockerized stack)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build and start the full stack
        run: docker compose -f backend/docker-compose.yml up -d --build --wait

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8081
        run: npx playwright test

  security:
    name: vuln + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
